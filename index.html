<style>
:root{--f-xl:36px;--f-m:16px;--f-s:14px;--f-xs:12px;--night:#0b1410;--ink:#eef2ee;--mute:#93a097;--gold:#e6b65c;--me:#e6b65c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--night);color:var(--ink);font:400 var(--f-m)/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
 radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 78% 12%,#fff6 50%,transparent 51%),
 radial-gradient(1.4px 1.4px at 64% 30%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 30% 8%,#fff5 50%,transparent 51%),
 radial-gradient(1px 1px at 90% 44%,#fff5 50%,transparent 51%),radial-gradient(1.2px 1.2px at 6% 52%,#fff6 50%,transparent 51%),
 radial-gradient(1px 1px at 44% 22%,#fff4 50%,transparent 51%),radial-gradient(120% 70% at 50% 40%,#17281e 0%,transparent 65%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
[hidden]{display:none!important}
.scr{position:relative;min-height:100dvh;max-width:560px;margin:0 auto;padding:18px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
h1{font:700 clamp(42px,12vw,60px)/1 "Inter Tight",sans-serif;letter-spacing:-.04em;margin:0;text-align:center}
h1 em{font:italic 400 1.05em Newsreader,Georgia,serif;letter-spacing:-.01em}
.tag{margin:8px 0 0;text-align:center;color:var(--mute);font-size:var(--f-m)}
.tag em{font:italic 400 1.15em Newsreader,Georgia,serif;color:var(--ink)}
.hero{flex:1;display:flex;align-items:center;justify-content:center;min-height:250px}
.hero svg{width:min(96%,440px);height:auto;overflow:visible}
.how{list-style:none;margin:20px 0 20px;padding:0;display:flex;flex-direction:column;gap:10px}
.how li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;font:500 var(--f-m)/1.35 "Inter Tight",sans-serif;color:#d6ded8}
.how svg{width:40px;height:40px}
input{width:100%;font:500 var(--f-m) Inter,sans-serif;color:var(--ink);background:#ffffff0d;border:1px solid #ffffff1a;border-radius:14px;padding:14px 16px;outline:none;text-align:center}
input:focus{border-color:var(--gold)}
input::placeholder{color:#ffffff55}
.btns{display:flex;gap:10px;margin-top:12px}
.pri,.sec{flex:1;padding:15px 18px;border-radius:14px;font:600 var(--f-m) "Inter Tight",sans-serif;letter-spacing:-.01em;transition:transform .15s,opacity .2s}
.pri{background:var(--gold);color:#1a1408}
.sec{background:#ffffff12}
.pri:active,.sec:active{transform:scale(.97)}
.pri:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.conn{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 0;color:var(--mute);font-size:var(--f-s);text-align:center}
.conn i{width:7px;height:7px;border-radius:50%;background:#ffffff40;flex:none}
.conn i.on{background:#8fc186;box-shadow:0 0 8px #8fc186}
#s-lobby{justify-content:center}
#s-lobby h2{font:700 var(--f-xl) "Inter Tight",sans-serif;letter-spacing:-.03em;margin:0 0 18px;text-align:center}
#lobbyList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
#lobbyList li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#ffffff0a;font:500 var(--f-m) "Inter Tight"}
#lobbyList li .t{margin-left:auto;font-size:var(--f-xs);color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 var(--f-xs) "Inter Tight";color:#0b1410;flex:none}
#lobbyTag{color:var(--mute);text-align:center;margin:18px 0 6px}
.ghost{display:block;margin:14px auto 0;color:var(--mute);font-size:var(--f-s);padding:8px 14px}
/* game */
#s-game{padding-top:12px}
.chips{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:32px;padding:0 38px}
.chip{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:99px;font:600 var(--f-s) "Inter Tight";transition:opacity .3s,background .3s;font-variant-numeric:tabular-nums}
.chip.me{background:#ffffff12}
.chip i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 var(--f-xs) "Inter Tight";color:#0b1410;font-style:normal;position:relative}
.chip.wait{opacity:.45}
.chip.in i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--c);opacity:.85}
.chip .plus{font-size:var(--f-xs);color:#a9d6a0;margin-left:-2px}
.meta{display:flex;justify-content:center;flex-wrap:wrap;margin-top:8px;font:500 var(--f-s) Inter,sans-serif;color:var(--mute);font-variant-numeric:tabular-nums}
.meta span+span::before{content:"·";margin:0 7px;color:#ffffff33}
.meta .hp{color:inherit}
.meta .hp.low{color:#f0a070}
.tbar{height:1px;margin:8px auto 0;width:120px;background:#ffffff10;border-radius:2px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--me);transition:width .5s linear}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.stage svg{width:100%;max-height:min(64vh,620px);overflow:visible;touch-action:manipulation}
.line{text-align:center;margin:0 0 12px;font:500 var(--f-m) "Inter Tight",sans-serif;color:#d6ded8;min-height:22px}
.hand{display:flex;justify-content:center;gap:10px}
.card{flex:0 1 27%;max-width:112px;aspect-ratio:3/4;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#1d2c23,#121b15);box-shadow:inset 0 0 0 1px #ffffff10,0 10px 24px -12px #000;transition:transform .22s cubic-bezier(.2,.9,.3,1.2),box-shadow .2s,opacity .3s}
.card svg{width:92%;height:auto}
.card.sp,.card.rare{box-shadow:inset 0 0 0 1px #e6b65c70,0 10px 24px -12px #000}
.card{transform:translateY(var(--dy,0)) rotate(var(--rot,0))}
.card[aria-pressed=true]{transform:translateY(-14px) rotate(0);box-shadow:inset 0 0 0 1.5px var(--me),0 0 30px -6px var(--me),0 16px 30px -12px #000}
.card:disabled{opacity:.3;cursor:default}
.hand.deal .card{animation:deal .5s cubic-bezier(.2,.9,.3,1.2) both}
.hand.deal .card:nth-child(2){animation-delay:.07s}.hand.deal .card:nth-child(3){animation-delay:.14s}.hand.deal .card:nth-child(4){animation-delay:.21s}
@keyframes deal{from{transform:translateY(60px) rotate(6deg);opacity:0}}
.quit{position:absolute;top:10px;left:8px;width:36px;height:36px;border-radius:50%;color:var(--mute);font-size:22px;line-height:1}
.over{text-align:center;animation:up .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.over .big{font:700 var(--f-xl)/1.05 "Inter Tight",sans-serif;letter-spacing:-.035em;margin:0;text-wrap:balance}
.over .sub{color:#c3ccc5;margin:8px 0 6px}
/* board fx */
.isle{animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.cell{cursor:default}
.open{cursor:pointer}
.hl{animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.04}50%{opacity:.16}}
.cell.lift{animation:lift .3s cubic-bezier(.2,.9,.3,1.5) both}
@keyframes lift{to{transform:translateY(-5px)}}
.pool{opacity:0;animation:pool .35s ease-out both}
@keyframes pool{to{opacity:.4}}
.rip{animation:rip .6s ease-out both}
@keyframes rip{from{transform:scale(1);opacity:.9}to{transform:scale(1.75);opacity:0}}
.tree.tremble{animation:tremble .28s ease-in-out infinite}
@keyframes tremble{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.fly{position:fixed;left:-9px;top:-12px;width:18px;height:24px;border-radius:5px;background:#16231b;border:1.5px solid;box-shadow:0 0 14px -2px currentColor;pointer-events:none;z-index:50}
.slow .tree{animation-play-state:paused}
.crownfx{opacity:0;filter:blur(2px);animation:crown 1.1s ease-in .45s both}
@keyframes crown{0%{opacity:0;transform:translateY(0)}25%{opacity:.8}100%{opacity:0;transform:translateY(var(--h))}}
.lant{opacity:0;animation:lant 5s ease-in infinite both}
@keyframes lant{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}100%{opacity:0;transform:translate(12px,-170px)}}
.chip.bump{animation:bump .7s ease-out}
@keyframes bump{30%{transform:scale(1.12);box-shadow:0 0 18px -4px var(--c)}}
.stage,.hero{transition:transform .25s ease-out;will-change:transform}
#s-join.intro h1,#s-join.intro .tag,#s-join.intro .how,#s-join.intro input,#s-join.intro .btns,#s-join.intro .conn{animation:intro .9s ease-out both;animation-delay:2.3s}
#s-join.intro .tag{animation-delay:2.6s}#s-join.intro .how{animation-delay:2.9s}#s-join.intro input,#s-join.intro .btns,#s-join.intro .conn{animation-delay:3.2s}
@keyframes intro{from{opacity:0;transform:translateY(10px)}}
.chip.lead b::before{content:"\265B";color:var(--gold);font-size:.85em;margin-right:3px}
.nt{transform-box:fill-box;transform-origin:50% 100%;animation:nt .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes nt{0%{transform:translateY(-26px) scale(.5);opacity:0}60%{transform:translateY(2px) scale(1.05,.95);opacity:1}80%{transform:translateY(-1px) scale(.99,1.01)}100%{transform:none}}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .6s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.swing{transform-box:fill-box;transform-origin:20% 90%;animation:swing .45s ease-in-out 2}
@keyframes swing{50%{transform:rotate(-38deg)}}
.lab{animation:lab 1.6s ease-out both}
@keyframes lab{from{transform:translateY(10px);opacity:0}20%{transform:none;opacity:1}80%{opacity:1}to{transform:translateY(-16px);opacity:0}}
.ghost-t{opacity:.5}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
@media (min-width:900px){.scr{max-width:620px}}
@media (max-width:520px){.stage{margin:0 -12px}}
#skyA,#skyB{position:fixed;inset:0;z-index:-2;transition:opacity 2.4s ease;pointer-events:none}
body::before{z-index:-1;opacity:var(--stars,1);transition:opacity 2s}
.meta .fin{color:var(--gold)}
.chip .plus.rate{color:var(--mute);font-weight:500}
.chip .plus.gain{color:#a9d6a0;animation:lab 2.2s ease-out both}
.card.rare[aria-pressed=true],.card.sp[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--me),0 0 30px -6px var(--me),0 16px 30px -12px #000}
.over .story{color:#d6ded8;font:italic 400 var(--f-m)/1.4 Newsreader,Georgia,serif;margin:0 auto 6px;max-width:34ch}
.tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite;transition:opacity .25s}
@keyframes sway{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}
.tree.faded{opacity:.22}
.fallR,.fallL{transform-box:view-box;animation:fallR 1.1s cubic-bezier(.55,0,.85,.45) both}
.fallL{animation-name:fallL}
@keyframes fallR{0%{transform:rotate(0)}12%{transform:rotate(-3deg)}85%{opacity:1}100%{transform:rotate(84deg);opacity:0}}
@keyframes fallL{0%{transform:rotate(0)}12%{transform:rotate(3deg)}85%{opacity:1}100%{transform:rotate(-84deg);opacity:0}}
.chip-p{transform-box:fill-box;animation:chipp .9s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes chipp{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),calc(var(--dy) + 30px));opacity:0}}
svg.shake{animation:shake .45s ease}
@keyframes shake{20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,1px)}80%{transform:translate(1px,0)}}
.pulse{animation:pulse .5s ease-in-out 3}
@keyframes pulse{50%{stroke-width:5px}}
body.danger .isle{filter:saturate(.75) brightness(.9)}
.isle{transition:filter 1.5s}
#board{transition:transform 3.2s cubic-bezier(.3,.1,.2,1)}
#board.rise{animation:rise 1.5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(60px) scale(.94);opacity:0}}
#board.pullback{transform:scale(.86) translateY(-4%)}
.chips.many{gap:4px}
.chips.many .chip{font-size:var(--f-xs);padding:2px 8px 2px 3px;gap:7px}
.chips.many .chip i{width:20px;height:20px;font-size:10px}
.chip i.dash{outline:1.5px dashed var(--c);outline-offset:1.5px}
.chip i.dot{outline:2px dotted var(--c);outline-offset:1.5px}
.evp.now{color:var(--gold)}
.banner{animation:banner 2.2s cubic-bezier(.2,.8,.3,1) both}
@keyframes banner{0%{transform:translateX(-120%);opacity:0}25%{transform:none;opacity:1}80%{opacity:1}100%{opacity:0}}
.clatter{transform-box:fill-box;transform-origin:50% 50%;animation:clatter .9s ease-in .5s both}
@keyframes clatter{to{transform:translate(6px,30px) rotate(80deg);opacity:0}}

</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="gl2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5"/></filter>
  <filter id="cs" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="1.6"/></filter>
</defs></svg>

<div id="skyA"></div><div id="skyB"></div>
<section class="scr" id="s-join">
  <div class="hero"><svg id="hero" aria-hidden="true"></svg></div>
  <h1>Grow <em>or</em> cut</h1>
  <p class="tag">an <em>Overstory</em> game</p>
  <ul class="how" id="how"></ul>
  <input id="name" placeholder="Your name" maxlength="16" autocomplete="off">
  <input id="code" placeholder="Room code (leave empty to start a table)" maxlength="4" autocomplete="off" autocapitalize="characters" hidden style="margin-top:8px;text-transform:uppercase">
  <div class="btns"><button class="pri" id="joinBtn" disabled>Join the table</button><button class="sec" id="soloBtn">Practice</button></div>
  <p class="conn"><i id="connDot"></i><span id="connText">Connecting…</span></p>
</section>

<section class="scr" id="s-lobby" hidden>
  <h2 id="lobbyH">The table</h2>
  <button class="ghost" id="copyLink" hidden style="margin:-8px auto 14px">Copy invite link</button>
  <ul id="lobbyList"></ul>
  <p id="lobbyTag"></p>
  <button class="pri" id="hostBtn">Host this game</button>
  <button class="pri" id="startBtn">Deal</button>
  <button class="ghost" id="leaveBtn">Leave</button>
</section>

<section class="scr" id="s-game" hidden>
  <button class="quit" id="quitBtn" aria-label="Leave game">×</button>
  <div class="chips" id="chips"></div>
  <div class="meta"><span id="round"></span><span class="hp" id="hp"></span><span class="evp" id="ev" hidden></span></div>
  <div class="tbar"><i id="tfill"></i></div>
  <div class="stage"><svg id="board" aria-label="Island"></svg></div>
  <p class="line" id="line"></p>
  <div class="hand" id="hand"></div>
  <div class="over" id="over" hidden>
    <p class="big" id="overBig"></p>
    <p class="story" id="overStory"></p>
    <p class="sub" id="overSub"></p>
    <div class="btns"><button class="pri" id="againBtn">Play again</button><button class="sec" id="exitBtn">Exit</button></div>
    <button class="ghost" id="cardBtn">Save the forest card</button>
  </div>
</section>

<script>
(function () {

  var COLORS = ['#e6b65c', '#e8875f', '#8ec3e0', '#b49be0', '#f48fb1', '#f1ead8', '#5b7cfa', '#c8e04a'];
  var DASH = ['', '', '', '', '5 3.2', '5 3.2', '.1 4.2', '.1 4.2'];
  var BOTS = [{ n: 'Mimi', grow: 1.3, cut: .8 }, { n: 'Neelay', grow: .9, cut: 1.35 }];

  function $(id) { return document.getElementById(id); }
  function rnd(n) { return Math.floor(Math.random() * n); }
  function clean(s) { return String(s || '').replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁤﻿]/g, '').trim().slice(0, 16); }

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  function shade(h, a) { var n = parseInt(h.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255, f = a < 0 ? 0 : 255, t = Math.abs(a); r = Math.round(r + (f - r) * t); g = Math.round(g + (f - g) * t); b = Math.round(b + (f - b) * t); return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1); }
  function mix(a, b, t) { var x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16); var r = Math.round((x >> 16) * (1 - t) + (y >> 16) * t), g = Math.round((x >> 8 & 255) * (1 - t) + (y >> 8 & 255) * t), bl = Math.round((x & 255) * (1 - t) + (y & 255) * t); return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1); }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  /* ---------- hex island: 19 tiles, axial coords ---------- */
